# Project-owned template. Copy to .github/workflows/backlog-review.yml.
# A read-and-report reconciliation of open tasks, written to the job summary and, when
# CONDUCTOR_BACKLOG_REVIEW_ISSUE names an existing issue number, posted there as a comment.
# It never creates issues or changes labels. Beside the open tasks it reads pull requests and
# their reviews (one paginated GraphQL search each for the merged and the open ones, which is
# what "pull-requests: read" below is for) and lists the merged pull requests nobody has
# reviewed and the open ones whose head has waited for a review (ADR 0011). A review counts
# as `linked-task` counts it: submitted, by an owner, member, collaborator or bot, and, from
# the pull request author's own login, only when its text starts with "Reviewer: <runtime>".
# Repository variables (all optional):
#   CONDUCTOR_PRIORITY_LABELS   comma-separated highest first, default "P0,P1,P2,P3"
#   CONDUCTOR_BLOCKED_LABEL     default "blocked:owner"
#   CONDUCTOR_CATEGORY_PREFIX   default "kind:"
#   CONDUCTOR_TRACKING_LABEL    default "kind:tracking"
#   CONDUCTOR_READY_LABEL       default "status:ready"; an open task without it is in Triage
#   CONDUCTOR_STALE_DAYS        default "7"
#   CONDUCTOR_BACKLOG_REVIEW_ISSUE  issue number to comment on; unset means summary only
name: Backlog reconciliation
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  pull-requests: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      PRIORITY_LABELS: ${{ vars.CONDUCTOR_PRIORITY_LABELS || 'P0,P1,P2,P3' }}
      BLOCKED_LABEL: ${{ vars.CONDUCTOR_BLOCKED_LABEL || 'blocked:owner' }}
      CATEGORY_PREFIX: ${{ vars.CONDUCTOR_CATEGORY_PREFIX || 'kind:' }}
      TRACKING_LABEL: ${{ vars.CONDUCTOR_TRACKING_LABEL || 'kind:tracking' }}
      READY_LABEL: ${{ vars.CONDUCTOR_READY_LABEL || 'status:ready' }}
      STALE_DAYS: ${{ vars.CONDUCTOR_STALE_DAYS || '7' }}
      REVIEW_ISSUE: ${{ vars.CONDUCTOR_BACKLOG_REVIEW_ISSUE }}
    steps:
      - name: Build the reconciliation report
        shell: python
        run: |
          import datetime, json, os, re, subprocess, sys

          # Merged pull requests are listed as unreviewed from this moment on: the merge of
          # the change that made `linked-task` read native GitHub reviews (Conductor #126,
          # pull request #141). Before it a review was a line in the pull request body, so an
          # earlier merge without a native review was not unread. A project that copies this
          # file may move it to the day it adopted the workflow.
          REVIEW_CUTOVER = "2026-11-23T18:27:56Z"

          def gh(*args):
              return subprocess.run(["gh", *args], check=True, capture_output=True, text=True).stdout

          def moment(text):
              return datetime.datetime.fromisoformat(text.replace("Z", "+00:00"))

          PULLS = """
          query($q: String!, $endCursor: String) {
            search(query: $q, type: ISSUE, first: 50, after: $endCursor) {
              pageInfo { hasNextPage endCursor }
              nodes { ... on PullRequest {
                number title createdAt mergedAt isDraft headRefOid
                author { login }
                commits(last: 1) { nodes { commit { committedDate } } }
                reviews(first: 100) { nodes { state body authorAssociation author { login __typename } commit { oid } } }
              } }
            }
          }"""

          def pulls(search):
              # One search, paginated by gh; a failure is returned as text and shown in the
              # report's section instead of ending the run before the report is written.
              run = subprocess.run(["gh", "api", "graphql", "--paginate", "--slurp", "-f", f"query={PULLS}", "-f", f"q=repo:{repo} is:pr {search}"],
                                   capture_output=True, text=True)
              if run.returncode:
                  return None, f"could not be read (gh api graphql exit {run.returncode}): {run.stderr.strip() or run.stdout.strip() or 'no output'}"
              try:
                  return [node for page in json.loads(run.stdout) for node in page["data"]["search"]["nodes"] if node], None
              except (ValueError, TypeError, KeyError, AttributeError) as error:
                  return None, f"could not be parsed ({type(error).__name__}: {error})"

          def reviews_that_count(pull):
              author = ((pull.get("author") or {}).get("login") or "").lower()
              counted = []
              for review in ((pull.get("reviews") or {}).get("nodes") or []):
                  reviewer = review.get("author") or {}
                  login = (reviewer.get("login") or "").lower()
                  if (review.get("state") or "").upper() not in ("APPROVED", "COMMENTED", "CHANGES_REQUESTED") or not login:
                      continue
                  if (review.get("authorAssociation") or "").upper() not in ("OWNER", "MEMBER", "COLLABORATOR") and reviewer.get("__typename") != "Bot":
                      continue
                  if login == author and not re.match(r"\s*Reviewer:[ \t]*\S", review.get("body") or ""):
                      continue
                  counted.append(review)
              return counted

          repo = os.environ["GITHUB_REPOSITORY"]
          priorities = [p.strip() for p in os.environ["PRIORITY_LABELS"].split(",") if p.strip()]
          blocked, prefix, tracking = os.environ["BLOCKED_LABEL"], os.environ["CATEGORY_PREFIX"], os.environ["TRACKING_LABEL"]
          ready = os.environ["READY_LABEL"]
          review_issue = os.environ.get("REVIEW_ISSUE", "").strip()
          stale_after = datetime.timedelta(days=int(os.environ["STALE_DAYS"]))
          now = datetime.datetime.now(datetime.timezone.utc)
          issues = json.loads(gh("issue", "list", "--repo", repo, "--state", "open", "--limit", "500",
                                 "--json", "number,title,labels,assignees,updatedAt,createdAt"))
          def labels(issue):
              return [label["name"] for label in issue["labels"]]
          def ref(issue):
              return f"#{issue['number']} {issue['title']}"
          def updated(issue):
              return moment(issue["updatedAt"])

          triage, untouched, blocked_list, tracking_list, stale_owner = [], [], [], [], []
          by_priority = {p: [] for p in priorities}
          for issue in issues:
              names = labels(issue)
              is_tracking = tracking in names
              found = [p for p in priorities if p in names]
              categories = [name for name in names if name.startswith(prefix)]
              # Triage is every open task without the readiness label; the notebook issue this
              # report is posted on is not a record. Blocked is a flag and never stands in for
              # a priority, so a task with the marker alone still lacks one.
              lacks = (["no priority"] if not found and not is_tracking else []) + (["no category"] if len(categories) != 1 else [])
              if ready not in names and str(issue["number"]) != review_issue:
                  triage.append(ref(issue) + (f" ({', '.join(lacks)})" if lacks else ""))
              elif ready in names and lacks:
                  triage.append(f"{ref(issue)} (carries `{ready}`, {', '.join(lacks)})")
              for p in found:
                  by_priority[p].append(issue)
              if found and now - updated(issue) > stale_after:
                  untouched.append(f"{found[0]} {ref(issue)} (last update {updated(issue).date()})")
              if blocked in names:
                  blocked_list.append(ref(issue))
              if is_tracking:
                  tracking_list.append(ref(issue))
              if issue["assignees"] and now - updated(issue) > 2 * stale_after:
                  stale_owner.append(f"{ref(issue)} assigned to {', '.join(a['login'] for a in issue['assignees'])}")
          highest = next((p for p in priorities if by_priority[p]), None)

          failed = False
          cutover = moment(REVIEW_CUTOVER)
          merged, problem = pulls(f"is:merged merged:>={cutover.date()}")
          if problem:
              failed, unread = True, [f"merged pull requests {problem}"]
          else:
              merged = sorted((pull for pull in merged if pull.get("mergedAt") and moment(pull["mergedAt"]) >= cutover), key=lambda pull: pull["mergedAt"])
              unread = [f"#{pull['number']} {pull['title']} (merged {moment(pull['mergedAt']).date()})" for pull in merged if not reviews_that_count(pull)]
          opened, problem = pulls("is:open")
          if problem:
              failed, waiting = True, [f"open pull requests {problem}"]
          else:
              waiting = []
              for pull in sorted(opened, key=lambda pull: pull["number"]):
                  head = (pull.get("headRefOid") or "").lower()
                  if any(((review.get("commit") or {}).get("oid") or "").lower() == head for review in reviews_that_count(pull)):
                      continue
                  # The head has waited since the pull request opened or since its last commit
                  # was made, whichever is later.
                  commits = ((pull.get("commits") or {}).get("nodes") or [])
                  since = max([moment(pull["createdAt"])] + [moment(node["commit"]["committedDate"]) for node in commits])
                  if now - since > stale_after:
                      waiting.append(f"#{pull['number']} {pull['title']} (head {head[:7]} unreviewed for {(now - since).days} days" + (", draft" if pull.get("isDraft") else "") + ")")

          lines = [f"# Backlog reconciliation {now.date()}", "",
                   f"Open tasks: {len(issues)}. Highest open priority: {highest or 'none'}"
                   + (f" ({len(by_priority[highest])} tasks)" if highest else "") + ".", ""]
          def section(title, items):
              lines.extend([f"## {title}", ""] + ([f"- {item}" for item in items] or ["- none"]) + [""])
          section("Highest open priority, oldest first", [ref(i) for i in sorted(by_priority[highest], key=lambda i: i["createdAt"])] if highest else [])
          section(f"Triage: open without `{ready}`, and any task without one priority and one category", triage)
          section(f"Priority untouched for more than {stale_after.days} days", untouched)
          section("Owner-blocked: confirm the blocker still holds", blocked_list)
          section("Tracking records: confirm open children remain", tracking_list)
          section(f"Assigned but silent for more than {2 * stale_after.days} days (stale or unknown, not proof of abandonment)", stale_owner)
          section(f"Merged since {cutover.date()} with no review: merged unread, for a Reviewer on another runtime to read", unread)
          section(f"Open pull requests whose head has had no review for more than {stale_after.days} days", waiting)
          lines.append("Anything arising from this report is filed as a record in Triage, or as a sub-issue of the open record it belongs to. Filing needs no approval; Ready, Merge and Reject stay the owner's.")
          report = "\n".join(lines)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(report + "\n")
          if review_issue:
              subprocess.run(["gh", "issue", "comment", review_issue, "--repo", repo, "--body", report], check=True)
          print(report)
          if failed:
              print("::error::The report was written, but pull requests or their reviews could not be read; see its last two sections. Check that the workflow token has pull-requests: read, then run the workflow again.")
          sys.exit(1 if failed else 0)
