# Cost defaults. A project that replaces the steps below with its own keeps these:
# - Trigger: pull_request only. No push trigger on the integration branch; add a weekly
#   schedule if the project wants `main` proven.
# - Concurrency: one group per pull request, cancel-in-progress, so a new push stops the
#   superseded run.
# - A timeout on every job.
# - Linux runners unless the task record names another: macOS bills 10x, Windows 2x.
# - Heavy steps gated on changed paths at step level, never by a workflow-level path filter,
#   so the required check still reports.
# - Jobs that run about a minute folded into one: each job bills a rounded-up minute.
name: CI
on:
  pull_request:
  workflow_call:
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Whitespace and conflict markers
        run: git diff --check
      - name: Install actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
      - name: Lint the workflows
        run: ./actionlint -color
      - name: Test the linked-task checker
        run: python3 -m unittest discover -s tests -p 'test_*.py'
